function applyTheme(){const p=th(),s=D.s,bg=p.bg||s.c2,ac=p.ac||s.c1,r=document.documentElement.style,h=bg.replace("#",""),L=parseInt(h.slice(0,2),16)*.299+parseInt(h.slice(2,4),16)*.587+parseInt(h.slice(4,6),16)*.114;r.setProperty("--bg",bg);r.setProperty("--gold",ac);r.setProperty("--ink",L>150?"#1d1a16":"#f3ead8")}
const camp=()=>{const c=D.s.camp;return c&&c.on&&c.pct>0?`<div class="camp">🏷️ ${esc(c.name||"Kampanya")} · %${c.pct} indirim${c.cat!="all"?" ("+esc(D.cats.find(x=>x.id==c.cat)?.name||"")+")":""}</div>`:""};
const campCard=()=>{const c=D.s.camp;return `<div class="card"><h3>Kampanya / indirim</h3><label>Durum</label><select data-cp="on"><option value="0">Kapalı</option><option value="1" ${c.on?"selected":""}>Açık</option></select><label>Kampanya adı</label><input data-cp="name" value="${esc(c.name)}" placeholder="Örn: Öğretmenler Günü özel"><label>İndirim oranı (%)</label><input type="number" min="0" max="90" data-cp="pct" value="${c.pct}"><label>Uygulanacak kategori</label><select data-cp="cat"><option value="all">Tüm ürünler</option>${D.cats.map(x=>`<option value="${x.id}" ${c.cat==x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`};
const themeCard=()=>{const s=D.s,n=s.theme=="normal";return `<div class="card"><h3>Tema ve renkler</h3><label>Hazır renk kombinasyonları</label><div style="display:flex;gap:10px;flex-wrap:wrap">${PAL.map((p,i)=>`<div style="text-align:center"><button class="sw" data-pal="${i}" aria-label="${p.n}" style="background:linear-gradient(135deg,${p.bg} 50%,${p.ac} 50%)"></button><div class="muted" style="font-size:12px">${p.n}</div></div>`).join("")}</div><div style="display:flex;gap:14px;opacity:${n?1:.45}"><div><label>Ana renk</label><input type="color" data-s="c1" value="${s.c1}"></div><div><label>İkincil (zemin) renk</label><input type="color" data-s="c2" value="${s.c2}"></div></div><label>Özel gün teması (elle seç, sadece arka planı değiştirir)</label><select data-s="theme">${Object.entries(PRE).map(([k,v])=>`<option value="${k}" ${s.theme==k?"selected":""}>${v.n}</option>`).join("")}</select><p class="muted">${n?"Normal günde yukarıdaki renkler geçerli.":"Özel gün teması renkleri ve arka planı belirler. Kendi renkleriniz için Normal gün'ü seçin veya hazır kombinasyona dokunun."}</p><label>Duyuru / özel gün mesajı (menünün üstünde görünür)</label><input data-s="msg" maxlength="80" value="${esc(s.msg||"")}" placeholder="Örn: Öğretmenler Günü'nüz kutlu olsun"></div>`};
const total=()=>Object.entries(cart).reduce((a,[id,q])=>{const it=D.items.find(x=>x.id==id);return a+q*(it?eff(it):0)},0);
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);

function menu(){
 const s=D.s;tab=tab||D.cats[0]?.id;
 let h=`<div class="wrap">${my?mine():""}<div class="hero"><h1>${esc(s.title)}</h1><p>${esc(s.desc)}</p>${s.msg?`<p style="color:var(--gold);font-family:'Cormorant Garamond',Georgia,serif;font-size:22px">${esc(s.msg)}</p>`:""}${camp()}<br><div class="wifi">Wi-Fi şifresi: <b>${esc(s.wifi)}</b></div><div class="muted" style="margin-top:10px">${s.self?"Self servis · siparişiniz isminizle çağrılır":"Masa servisi · siparişiniz masanıza getirilir"}</div></div>`;
 h+=`<div class="tabs">${D.cats.map(c=>`<button class="${tab==c.id?"on":""}" data-tab="${c.id}">${esc(c.name)}</button>`).join("")}</div>`;
 D.cats.forEach(c=>{const its=D.items.filter(i=>i.c==c.id);if(!its.length)return;
  h+=`<h2 class="cat" id="cat-${c.id}">${esc(c.name)}</h2>`;
  its.forEach(i=>{const q=cart[i.id]||0;
   h+=`<div class="item ${i.sold?"sold":""}">${img(i)}<div class="t"><h3>${esc(i.n)}</h3><div class="p">${eff(i)<i.p?`<s class="muted">${tl(i.p)}</s> `:""}${tl(eff(i))}</div></div>${i.sold?`<span class="badge">Tükendi</span>`:q?`<div class="qty"><button data-m="${i.id}" aria-label="Azalt">−</button><b>${q}</b><button data-a="${i.id}" aria-label="Artır">+</button></div>`:`<button class="btn" data-a="${i.id}">Ekle</button>`}</div>`})});
 
 h+=`<div style="height:60vh"></div></div>`;
 if(count())h+=`<div class="bar"><div><b>${count()} ürün</b><div class="gold" style="color:var(--gold)">${tl(total())}</div></div><button class="btn" data-go="cart">Siparişi gözden geçir</button></div>`;
 return h}
function mine(){const o=D.orders.find(o=>o.id==my);if(!o)return"";
 const st={new:"Siparişiniz alındı",preparing:"Siparişiniz hazırlanıyor",done:D.s.self?"Siparişiniz hazır! İsminiz çağrılıyor":"Siparişiniz masanıza getiriliyor",cancelled:"Siparişiniz iptal edildi"}[o.st]||"";
 const left=60-(Date.now()-o.t)/1000,can=o.st=="new"&&left>0;
 return `<div class="card" style="border-color:var(--gold)"><div class="muted">Sipariş #${esc(o.no)}${who(o)?" · "+who(o):""}</div><div class="big">${st}</div>${lineList(o).map(l=>`<div class="row" style="padding:2px 0"><span>${l.q} × ${esc(l.n)}</span><span>${tl(l.q*l.p)}</span></div>`).join("")}<div class="row" style="border-top:1px solid var(--line)"><b>Toplam</b><b>${tl(ototal(o))}</b></div>${can?`<p class="muted">Yanlış sipariş mi? İptal veya değiştirme için <b id="cd">${Math.ceil(left)}</b> saniyen var.</p><div style="display:flex;gap:10px"><button class="btn bad" data-cancel>İptal et</button><button class="btn alt" data-edit>Değiştir</button></div>`:(o.st=="done"||o.st=="cancelled"?`<button class="btn alt" data-clear>Yeni sipariş ver</button>`:"")}</div>`}
function cartSheet(){
 const s=D.s;let rows=Object.entries(cart).map(([id,q])=>{const i=D.items.find(x=>x.id==id);return i?`<div class="row"><span>${q} × ${esc(i.n)}</span><b>${tl(q*eff(i))}</b></div>`:""}).join("");
 return `<div class="sheet" data-close><div><h2 style="font-size:30px">Siparişiniz</h2>${rows}<div class="row" style="border-top:1px solid var(--line);margin-top:6px"><span>Toplam</span><b class="big" style="font-size:26px">${tl(total())}</b></div>
 ${s.self?`${MASA?`<div class="card">Masanız: <b>${esc(MASA)}</b></div>`:""}<label for="nm">İsminiz (siparişiniz hazır olunca bu isimle çağrılır)</label><input id="nm" maxlength="30" value="${esc(nm)}" autocomplete="given-name">`:`<div class="card">Masanız: <b>${esc(MASA||"bilinmiyor")}</b></div>`}
 <label for="nt">Sipariş notu (istemediğiniz malzeme, alerji vb.)</label><textarea id="nt" rows="3" maxlength="300" placeholder="Örn: fıstıksız olsun">${esc(note)}</textarea>
 <div id="err" style="color:var(--bad);min-height:22px;margin-top:6px"></div>
 <div style="display:flex;gap:10px"><button class="btn alt" data-x>Geri dön</button><button class="btn" style="flex:1" data-send>Siparişi gönder</button></div></div></div>`}
async function send(){
 const s=D.s;nm=($("#nm")?.value||"").trim();note=$("#nt").value.trim();const er=m=>$("#err").textContent=m;
 if(s.self&&nm.length<2)return er("Lütfen isminizi girin; siparişiniz bu isimle çağrılacak.");
 if(!s.self&&!MASA)return er("Masa bilgisi yok. Lütfen masanızdaki QR kodu okutun.");
 const lines=Object.entries(cart).filter(([id])=>{const i=D.items.find(x=>x.id==id);return i&&!i.sold}).map(([id,q])=>({id,q}));
 if(!lines.length)return er("Sepetiniz boş.");
 try{const r=await addDoc(collection(db,"orders"),{no:Math.floor(1000+Math.random()*9000),name:s.self?nm:"",table:MASA,k:MASA?KEY:"",note,lines,st:"new",t:serverTimestamp()});
  my=r.id;try{sessionStorage.setItem("my",JSON.stringify(my))}catch(e){}
  cart={};note="";sheet=null;watchOrders();draw();scrollTo({top:0,behavior:"smooth"})}catch(e){er("Sipariş gönderilemedi. Lütfen tekrar deneyin veya kasaya haber verin.")}}

function kasa(){
 if(!staff)return login("Kasa");
 const t0=dayStart().getTime(),td=D.orders.filter(o=>o.t>=t0&&o.st=="done"),ciro=td.reduce((a,o)=>a+(o.total??ototal(o)),0);
 const by=x=>D.orders.filter(o=>o.st==x),nw=by("new").reverse(),pr=by("preparing").reverse(),dn=by("done").slice(0,8);
 const btn=o=>o.st=="new"?`<button class="btn" data-act="${o.id}|preparing">Hazırlamaya başla</button>`:`<button class="btn" data-act="${o.id}|done">${D.s.self?"Hazır · ismi çağır":"Tamamla · masaya götür"}</button>`;
 const card=(o,a)=>`<div class="card"><div class="row"><b>#${esc(o.no)} · ${who(o)||"—"}</b><span class="muted">${new Date(o.t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span></div>${lineList(o).map(l=>`<div class="row" style="padding:2px 0"><span>${l.q} × ${esc(l.n)}</span></div>`).join("")}${o.note?`<div class="note">Not: ${esc(o.note)}</div>`:""}<div class="row"><b>${tl(o.total??ototal(o))}</b>${a?`<span style="display:flex;gap:6px"><button class="btn bad" data-act="${o.id}|cancelled">İptal</button>${btn(o)}</span>`:`<span class="badge">Tamamlandı</span>`}</div></div>`;
 return `<div class="wrap"><div class="stat"><h2 style="font-size:34px">Kasa</h2><span class="badge">${D.s.self?"Self servis modu":"Masa servisi modu"}</span><button class="btn alt" style="margin-left:auto" data-out>Çıkış</button></div>
 <div class="card"><div class="muted">Bugünün cirosu</div><div class="big">${tl(ciro)}</div><div class="muted">${td.length} tamamlanan sipariş</div></div>
 <div class="grid c3"><div style="grid-column:span 2"><h3>Yeni siparişler (${nw.length})</h3>${nw.map(o=>card(o,1)).join("")||`<p class="muted">Yeni sipariş bekleniyor.</p>`}<h3>Hazırlanıyor (${pr.length})</h3>${pr.map(o=>card(o,1)).join("")||`<p class="muted">Hazırlanan sipariş yok.</p>`}</div><div><h3>Son tamamlananlar</h3>${dn.map(o=>card(o,0)).join("")||`<p class="muted">Henüz yok.</p>`}</div></div></div>`}
function yon(){
 if(!admin)return login("Yönetim");
 const s=D.s;
 let h=`<div class="wrap"><div class="stat"><h2 style="font-size:34px">Yönetim</h2><button class="btn alt" style="margin-left:auto" data-out>Çıkış</button></div>
 <div class="card"><h3>Site bilgileri</h3><label>Restoran adı</label><input data-s="title" value="${esc(s.title)}"><label>Açıklama</label><textarea rows="2" data-s="desc">${esc(s.desc)}</textarea><label>Wi-Fi şifresi</label><input data-s="wifi" value="${esc(s.wifi)}">
 <label>Çalışma modu</label><select data-s="self"><option value="1" ${s.self?"selected":""}>Self servis (müşteri ismi girer)</option><option value="0" ${!s.self?"selected":""}>Masa servisi (QR masaya özel)</option></select></div>
 ${D.items.length?"":`<div class="card"><button class="btn" data-seed>Örnek menüyü yükle</button><p class="muted">İlk kurulumda örnek kategori ve ürünleri ekler.</p></div>`}${repCard()}${themeCard()}${campCard()}${tablesCard()}<div class="card"><h3>Kategoriler</h3>${D.cats.map(c=>`<div class="row"><input data-cn="${c.id}" value="${esc(c.name)}"><button class="btn bad" data-dc="${c.id}">Sil</button></div>`).join("")}<button class="btn alt" data-ac>+ Kategori ekle</button></div>
 <h3 style="margin-top:20px">Ürünler</h3>`;
 D.items.forEach(i=>{h+=`<div class="card"><div class="ed">${img(i)}<div><input data-in="${i.id}" value="${esc(i.n)}" aria-label="Ürün adı"><div style="display:flex;gap:8px;margin-top:8px"><input type="number" min="0" data-ip="${i.id}" value="${i.p}" aria-label="Fiyat"><select data-ic="${i.id}">${D.cats.map(c=>`<option value="${c.id}" ${c.id==i.c?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
 <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><label class="btn alt" style="margin:0">Fotoğraf<input type="file" accept="image/*" data-if="${i.id}" hidden></label><button class="btn alt" data-so="${i.id}">${i.sold?"Satışa aç":"Tükendi yap"}</button><button class="btn bad" data-di="${i.id}">Sil</button></div></div></div></div>`});
 h+=`<button class="btn" data-ai>+ Ürün ekle</button></div>`;return h}
function login(t){const u=D.me;return `<div class="wrap" style="text-align:center;padding-top:70px"><h2 style="font-size:36px">${t} girişi</h2><p class="muted">Yalnızca işletmenin yetkili Google hesapları girebilir.</p>${u?`<p style="color:var(--bad)">${esc(u.email)} hesabının bu sayfaya yetkisi yok.</p><button class="btn alt" data-out>Çıkış yap</button>`:`<button class="btn" data-login>Google ile giriş yap</button>`}</div>`}

function draw(){applyTheme();applyBg();navr();const r=route();$("#app").innerHTML=(r=="kasa"?kasa():r=="yonetim"?yon():menu())+(sheet=="cart"?cartSheet():"");window.scrollTo&&0}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a],[data-m],[data-tab],[data-go],[data-x],[data-send],[data-act],[data-cancel],[data-edit],[data-clear],[data-at],[data-dt],[data-print],[data-rep],[data-login],[data-out],[data-so],[data-di],[data-ai],[data-ac],[data-dc],[data-close],[data-pal],[data-seed],[data-mk]");if(!t)return;
 const d=t.dataset;if(d.close!==undefined&&e.target!==t)return;
 try{
 if(d.a)cart[d.a]=(cart[d.a]||0)+1;
 else if(d.m){cart[d.m]--;if(cart[d.m]<=0)delete cart[d.m]}
 else if(d.tab){tab=d.tab;draw();document.getElementById("cat-"+tab)?.scrollIntoView({behavior:"smooth"});return}
 else if(d.go)sheet="cart";
 else if(d.x!==undefined||d.close!==undefined){nm=$("#nm")?.value||nm;note=$("#nt")?.value||note;sheet=null}
 else if(d.send!==undefined){await send();return}
 else if(d.act){const [id,st]=d.act.split("|"),o=D.orders.find(x=>x.id==id);if(st=="cancelled"&&!confirm("Sipariş iptal edilsin mi?"))return;const u={st};if(st=="done"){u.doneAt=serverTimestamp();u.total=ototal(o)}await updateDoc(doc(db,"orders",id),u)}
 else if(d.cancel!==undefined){try{await updateDoc(doc(db,"orders",my),{st:"cancelled"})}catch(e){alert("İptal süresi dolmuş olabilir. Lütfen kasaya haber verin.")}}
 else if(d.edit!==undefined){const o=D.orders.find(x=>x.id==my);try{await updateDoc(doc(db,"orders",my),{st:"cancelled"})}catch(e){alert("Değiştirme süresi dolmuş olabilir. Lütfen kasaya haber verin.");draw();return}
  cart={};(o.lines||[]).forEach(l=>{if(D.items.some(i=>i.id==l.id&&!i.sold))cart[l.id]=Math.min(99,Math.max(1,Math.floor(+l.q)||1))});note=o.note||"";nm=o.name||"";clearMine();sheet="cart"}
 else if(d.clear!==undefined)clearMine();
 else if(d.at!==undefined)await addTable();
 else if(d.dt){if(confirm("Masa "+d.dt+" silinsin mi? Bu masanın QR kodu çalışmaz olur."))await deleteDoc(doc(db,"tables",d.dt))}
 else if(d.print!==undefined){window.print();return}
 else if(d.rep!==undefined){await loadRep();return}
 else if(d.login!==undefined)await signInWithPopup(auth,new GoogleAuthProvider());
 else if(d.out!==undefined)await signOut(auth);
 else if(d.so){const i=D.items.find(x=>x.id==d.so);await updateDoc(doc(db,"items",i.id),{sold:!i.sold})}
 else if(d.di){if(confirm("Bu ürün silinsin mi?"))await deleteDoc(doc(db,"items",d.di))}
 else if(d.ai!==undefined)await addDoc(collection(db,"items"),{c:D.cats[0]?.id||"",n:"Yeni ürün",p:0,e:"🍽️",sold:false,order:-Date.now()});
 else if(d.ac!==undefined)await addDoc(collection(db,"categories"),{name:"Yeni kategori",order:Date.now()});
 else if(d.dc){if(D.items.some(i=>i.c==d.dc))alert("Önce bu kategorideki ürünleri taşıyın veya silin.");else await deleteDoc(doc(db,"categories",d.dc))}
 else if(d.pal){const p=PAL[+d.pal];await setDoc(doc(db,"settings","main"),{theme:"normal",c1:p.ac,c2:p.bg},{merge:true})}
 else if(d.seed!==undefined)await seedDb();
 else if(d.mk!==undefined)await makeTables();
 }catch(err){alert("İşlem yapılamadı: "+(err.code||err.message))}
 draw()});
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset,S=o=>setDoc(doc(db,"settings","main"),o,{merge:true});
 try{
 if(d.s)await S({[d.s]:d.s=="self"?t.value=="1":t.value});
 else if(d.cp)await S({camp:{...D.s.camp,[d.cp]:d.cp=="on"?t.value=="1":d.cp=="pct"?Math.min(90,Math.max(0,+t.value||0)):t.value}});
 else if(d.rd!==undefined)await loadRep();
 else if(d.cn)await updateDoc(doc(db,"categories",d.cn),{name:t.value.slice(0,40)});
 else if(d.in)await updateDoc(doc(db,"items",d.in),{n:t.value.slice(0,60)});
 else if(d.ip)await updateDoc(doc(db,"items",d.ip),{p:Math.max(0,+t.value||0)});
 else if(d.ic)await updateDoc(doc(db,"items",d.ic),{c:t.value});
 else if(d.if&&t.files[0])await updateDoc(doc(db,"items",d.if),{img:await shrink(t.files[0])});
 }catch(err){alert("Kaydedilemedi: "+(err.code||err.message))}});
window.addEventListener("hashchange",()=>{sheet=null;draw()});
draw();
</script></body></html>
